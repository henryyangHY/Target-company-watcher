name: Daily job watch

on:
  # GitHub 的 cron 只吃 UTC，不認美國 DST，所以這裡排了四個時間點：
  #   13:00 UTC = 早上 8 點（夏令 CDT）    14:00 UTC = 早上 8 點（冬令 CST）
  #   01:00 UTC = 晚上 8 點（夏令 CDT）    02:00 UTC = 晚上 8 點（冬令 CST）
  # 由 fetch.js 用 RUN_HOURS 檢查芝加哥當地時間，不對就立刻結束。
  # 實際每天只會有 2 次真的跑，另外 2 次幾秒內就退出。
  schedule:
    - cron: '0 13,14,1,2 * * *'

  # Actions 頁面上手動觸發，用來測試
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        type: choice
        default: normal
        options:
          - normal      # 正常跑：只推新職缺，會寫回 seen.json
          - dry_run     # 只看 log，不推 Slack、不寫檔
          - test_slack  # 驗證 Slack 通不通：推一次現有職缺，不寫檔

permissions:
  contents: write # 需要寫回 seen.json 和 digests/

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # v4 是 Node 20 runtime，已被 GitHub 標記 deprecated（會強制拉到 Node 24 跑
      # 並在 log 留 warning）。v5 以上才是原生 node24。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 這是拿來跑 fetch.js 的 Node 版本，跟上面 action 的 runtime 無關。
          # Node 20 已於 2026-04 EOL，用 22 LTS。
          node-version: '22'

      - name: Scan career sites
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_HOURS: '8,20'
        run: |
          case "${{ inputs.mode }}" in
            dry_run)    node fetch.js --dry-run --force ;;
            test_slack) node fetch.js --test-slack ;;
            *)          node fetch.js ;;
          esac

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "job-watcher"
            git config user.email "actions@github.com"
            git add seen.json digests/
            git commit -m "chore: update seen state ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "沒有變動，不 commit"
          fi
